name: WorksAI CI/CD — worksai-linkengine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Brand/Secret Gate, Syntax & Stack Tests (worksai-linkengine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run ESM Lint & Brand/Secret Hygiene Gate
        run: npm run lint

      - name: Run Syntax & Module Check
        run: npm run typecheck

      - name: Run Unit, Domain Engine, Workers AI & R2 Persistence Tests
        run: npm test

      - name: Run PHP 8.x Syntax & Functional Bridge Verification
        run: |
          php -l php-bridge/*.php
          php php-bridge/php_bridge_test.php

      - name: Verify Worker Handler & Edge Smoke Check (linkengine.worksai.org)
        run: |
          node --input-type=module -e 'import { handleAppRequest } from "./src/worker.mjs"; const r = await handleAppRequest(new Request("https://linkengine.worksai.org/api/health")); const j = await r.json(); if (!j.ok || j.service !== "worksai-linkengine") process.exit(1); console.log("Verified handler:", j.service);'
          curl -sS -A "Mozilla/5.0 (compatible; WorksAI-CI/1.0)" https://linkengine.worksai.org/api/health | head -c 300 || true
